# GitHub Pages (Jekyll) site: https://su-engineering.github.io/eudi-disclosure-policy/
# The repository root is the site root, so relative links in Markdown work on
# GitHub and on the site alike.
title: EUDI Disclosure Policy
description: >-
  OpenID4VP DCQL request linter for EUDI Wallet verifiers. Check every
  credential and claim alternative against a data-minimization policy before
  the request reaches a wallet. TypeScript library and CLI for SD-JWT VC and
  ISO mdoc.
url: https://su-engineering.github.io
baseurl: /eudi-disclosure-policy
lang: en
theme: jekyll-theme-primer
logo: /docs/images/social-preview.png
author:
  name: su.engineering
  url: https://su.engineering
social:
  name: su.engineering
  links:
    - https://github.com/su-engineering
    - https://su.engineering
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-titles-from-headings
  - jekyll-default-layout
relative_links:
  enabled: true
  collections: false
titles_from_headings:
  strip_title: false
defaults:
  - scope:
      path: ''
    values:
      image: /docs/images/social-preview.png
exclude:
  - src/
  - test/
  - tools/
  - dist/
  - coverage/
  - node_modules/
  - package.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - tsconfig.json
  - tsconfig.core.json
  - tsup.config.ts
  - vitest.config.ts
  - eslint.config.js
